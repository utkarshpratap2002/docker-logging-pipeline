
# INPUT: Pulling Logs From CLoudTrail S3 Bucket
<source>
  @type s3
  aws_iam_role_arn "#{ENV['AWS_IAM_ROLE_ARN']}"
  s3_region "ap-south-1"
  s3_bucket "aws-cloudtrail-logs-efk-stack-944487268461-1a2815b1"
  s3_object_key_prefix "AWSLogs/944487268461/CloudTrail/"
  pos_file /fluentd/log/s3-cloudtrail-pos.dat
  store_as json
  add_object_metadata true
  tag "cloudtrail.events"

  # === CRITICAL FIX: The plugin requires this SQS block ===
  # We will define a dummy SQS block and set read_from_sqs to false 
  # to allow it to run in S3-polling mode.
  <sqs>
    queue_name "dummy-queue"
    # Although we are using an Instance Profile, some plugins still require these fields to be present.
    # Set them to dummy values as they won't be used if we're using a Role.
    aws_key_id "dummy" 
    aws_sec_key "dummy" 
    sqs_region "ap-south-1" 
    read_from_sqs false # Explicitly disable SQS reading if you want to poll S3
  </sqs>
</source>

# FILTER: Parse the nested CloudTrail JSON structure
<filter cloudtail.events>
  @type parser
  key_name message
  reserve_data true
  <parse>
    @type json
    stream_array_key Records
  </parse>
</filter>

# OUTPUT: Send the final, parsed logs to Elasticsearch
<match cloudtrail.events>
  @type elasticsearch
  host "es01"
  port 9200
  scheme http
  index_name "cloudtrail-%Y.%m.%d"
  logstash_format true
  include_tag_key true
  tag_key "@tag"
  <buffer>
    @type memory
    flush_interval 5s
  </buffer>
</match>

